[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linedb"
version = "0.1.0"
description = "A tiny SQL database that stores each table as a JSON Lines file"
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
web = ["flask>=2.2"]
dev = ["pytest", "flask>=2.2"]

[project.scripts]
linedb = "linedb.shell:main"
linedb-web = "linedb.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"linedb.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
